          - { name: "whatsapp_number", label: "Número WhatsApp (formato internacional, ej: +34000000000)", widget: "string", required: false }
          - { name: "address",        label: "Dirección física",      widget: "string", required: false }
          - { name: "hero_headline_line_1",       label: "Hero — línea 1 (sólida)",          widget: "string" }
          - { name: "hero_headline_line_2_stroke", label: "Hero — línea 2 (text-stroke)",     widget: "string" }
          - { name: "hero_subtitle",              label: "Hero — subtítulo",                 widget: "text" }
