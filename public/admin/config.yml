          - { name: "about_short",                label: "Short description (meta description)", widget: "text" }
          - { name: "opening_hours",              label: "Opening hours",                 widget: "string", required: false }
      - name: "ca"
        label: "Settings · Català"
        file: "src/content/settings/ca.json"
        fields:
          - { name: "brand_name",     label: "Nom de marca",     widget: "string", default: "SUBA TATTOO" }
          - { name: "tagline",        label: "Tagline",          widget: "string", default: "Technical Precision. Artistic Rawness." }
          - { name: "location",       label: "Ubicació curta",   widget: "string", default: "Barcelona · Underground Studio" }
          - { name: "contact_email",  label: "Correu de contacte", widget: "string" }
          - { name: "instagram_url",  label: "URL d'Instagram (principal)",  widget: "string", required: false }
          - { name: "instagram_url_secondary", label: "URL d'Instagram secundària (ex: línia de treball)", widget: "string", required: false }
          - { name: "whatsapp_number", label: "Número WhatsApp (format internacional, ex.: +34000000000)", widget: "string", required: false }
          - { name: "address",        label: "Adreça física",    widget: "string", required: false }
          - { name: "hero_headline_line_1",       label: "Hero — línia 1 (sòlida)",     widget: "string" }
          - { name: "hero_headline_line_2_stroke", label: "Hero — línia 2 (text-stroke)", widget: "string" }
          - { name: "hero_subtitle",              label: "Hero — subtítol",             widget: "text" }
          - { name: "about_short",                label: "Descripció curta (meta description)", widget: "text" }
          - { name: "opening_hours",              label: "Horari d'atenció",            widget: "string", required: false }
