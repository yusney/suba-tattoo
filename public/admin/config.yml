          - { name: "whatsapp_number", label: "WhatsApp number (international format, e.g. +44000000000)", widget: "string", required: false }
          - { name: "address",        label: "Physical address", widget: "string", required: false }
          - { name: "hero_headline_line_1",       label: "Hero — line 1 (solid)",        widget: "string" }
          - { name: "hero_headline_line_2_stroke", label: "Hero — line 2 (text-stroke)",   widget: "string" }
