        file: "src/content/settings/en.json"
        fields:
          - { name: "brand_name",     label: "Brand name",   widget: "string", default: "SUBA TATTOO" }
          - { name: "tagline",        label: "Tagline",      widget: "string", default: "Technical Precision. Artistic Rawness." }
          - { name: "location",       label: "Short location", widget: "string", default: "Barcelona · Underground Studio" }
          - { name: "contact_email",  label: "Contact email", widget: "string" }
