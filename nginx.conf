# ---- Content-Security-Policy (report-only) ----
# Report-Only first: it surfaces violations in the browser console without
# blocking anything, so the policy can be validated before enforcement.
# /admin/* is excluded: Decap CMS loads its bundle from unpkg and uses inline
# scripts, so it needs its own policy before any enforcement.
# NOTE: Astro currently emits inline <script type="module"> blocks and inline
# styles, so 'unsafe-inline' is required in script-src/style-src. Dropping it
# would need hashes/nonces (Astro CSP support or a build step).
# Empty value for /admin/* means the header is not added there.
map $uri $csp_report_only {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    ~^/admin/ "";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Don't advertise the nginx version in the Server header / error pages.
    server_tokens off;
    # Forms and OAuth params are tiny and the sidecar enforces its own 16 KB
    # limit, so cap request buffering well below nginx's 1 MB default.
    client_max_body_size 20k;

    # Emit relative Location headers on redirects (e.g. the trailing-slash
    # 301 for /galeria -> /galeria/). TLS terminates at Cloudflare, so nginx
    # only ever sees $scheme=http and would otherwise build an absolute
    # "Location: http://..." URL. The browser would then pay an extra
    # http -> https hop. A relative Location preserves the client's https.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Real 404 for unknown URLs: serve Astro's 404.html with a 404 status.
    # Without this, the catch-all used to fall back to /index.html and every
    # bad URL answered 200 (soft-404), which lets Google index junk.
    error_page 404 /404.html;

    # ---- Security headers ----
    # nginx's default inheritance model drops every server-level add_header as
    # soon as a location defines any add_header of its own (the asset, *.html
    # and /admin/ locations below all do). `merge` appends the parent's values
    # to the child's instead, so these four headers reach every location.
    # Requires nginx >= 1.29.3; the image is pinned to 1.31.3 (see Dockerfile).
    add_header_inherit merge;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Gzip compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ---- Static assets: cache aggressively (1 year, immutable) ----
    # These have content-hashed filenames from Astro's build, so they're safe.
    location ~* \.(jpg|jpeg|png|gif|webp|avif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- HTML: never cache — content edits should propagate fast ----
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        # Report-only CSP (see the map above): observes violations without
        # blocking. /admin/* gets an empty policy, i.e. no header.
        add_header Content-Security-Policy-Report-Only $csp_report_only always;
    }

    # ---- YAML: serve as application/x-yaml (nginx's default mime.types does
    # not include .yml, so static .yml files fall back to octet-stream and
    # Decap logs 'Response for config.yml was not yaml'). This still loads
    # in practice but the warning is noisy and risks regressions in future
    # Decap releases. ----
    location ~* \.ya?ml$ {
        default_type application/x-yaml;
    }

    # ---- Decap CMS admin: never cache ----
    location /admin/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- Decap CMS OAuth proxy ----
    # Use $http_x_forwarded_proto (the header the chain sent us — typically
    # 'https' from Cloudflare/Traefik). $scheme would be 'http' here because
    # nginx listens on :80 inside the container, and that would build a
    # redirect_uri starting with http://... which GitHub rejects as a bad
    # callback URL against the OAuth App's registered https://... value.
    location = /auth {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /callback {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /admin/callback {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
    }

    # ---- Contact / booking form: proxy to the Node sidecar, which sends the
    # email via Resend. Same header pattern as /auth so the sidecar sees the
    # public host and scheme (useful for logs / future per-origin logic).
    location = /api/contact {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- Default: Astro static routing ----
    # /sobre → /sobre/index.html
    # /en/sobre → /en/sobre/index.html
    # /detalle/ouroboros-descent → /detalle/ouroboros-descent/index.html
    # Anything else → 404 (served as /404.html by the error_page above).
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
